name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy src/

  # Core tests run against the lightweight install (no ML stack): reasoner,
  # reporting, CLI, and stubbed drift. RAG tests skip themselves here.
  test-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage gate
        run: pytest --cov=src/compliance_agent --cov-report=term --cov-fail-under=80
      - name: Run synthetic benchmark
        run: compliance-agent benchmark --dataset benchmarks/synthetic_cases.yaml --output json
      - name: Check installed dependencies
        run: python -m pip check

  # Full-stack job installs every optional profile so integration and import
  # compatibility are exercised together.
  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install all extras
        run: |
          pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Smoke-test optional imports
        run: python -c "import chromadb, legaldrift, sentence_transformers, streamlit"
      - name: Run full test suite
        run: pytest --cov=src/compliance_agent --cov-report=term --cov-fail-under=80
      - name: Type-check against the RAG extra
        run: mypy src/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: pip install -e ".[dev]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/compliance-agent-wheel
          /tmp/compliance-agent-wheel/bin/pip install dist/*.whl
          /tmp/compliance-agent-wheel/bin/compliance-agent --version
          cd /tmp
          /tmp/compliance-agent-wheel/bin/python -c "from compliance_agent.dashboard.state import resolve_sample_dir; assert (resolve_sample_dir() / 'rules' / 'gdpr_rules.yaml').is_file()"
