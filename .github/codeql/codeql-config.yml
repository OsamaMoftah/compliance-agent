name: Compliance Agent CodeQL

# `ingest_directory` is the deliberate user-facing boundary for selecting a
# local corpus. It canonicalizes the selected path, verifies that it exists and
# is a directory, and then only reads supported text files beneath that
# directory. The destructive persistence path is validated independently by
# RegulatoryRAG._validate_reset_target.
#
# CodeQL's path-injection query reports the expected CLI input at the source
# boundary even after those checks. Keep every other default security query
# enabled, and record this narrowly scoped, reviewed false-positive decision
# here rather than suppressing security analysis globally.
query-filters:
  - exclude:
      id: py/path-injection
